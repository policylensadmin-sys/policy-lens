<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="PolicyLens">
  <defs>
    <linearGradient id="pl-badge" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8" />
      <stop offset="1" stop-color="#4F46E5" />
    </linearGradient>
  </defs>
  <!-- Teal badge -->
  <rect width="40" height="40" rx="10" fill="url(#pl-badge)" />
  <!-- Document peeking behind the lens -->
  <rect x="10" y="8.5" width="14" height="19" rx="2.5" fill="#FFFFFF" opacity="0.28" />
  <path d="M13.5 14h7M13.5 18h7M13.5 22h4" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
  <!-- Magnifying lens -->
  <circle cx="24" cy="23" r="7.5" fill="#0B1220" fill-opacity="0.18" />
  <circle cx="24" cy="23" r="7.5" stroke="#FFFFFF" stroke-width="2.6" fill="none" />
  <circle cx="24" cy="23" r="2.6" fill="#FFFFFF" />
  <path d="M29.6 28.6l4 4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>
